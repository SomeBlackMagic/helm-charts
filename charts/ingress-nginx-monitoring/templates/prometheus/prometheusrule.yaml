{{- if and $.Values.prometheus.enabled ( $.Capabilities.APIVersions.Has "monitoring.coreos.com/v1" )  }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "ingress-nginx-monitoring.fullname" . }}
  {{- if $.Values.prometheus.rule.namespace }}
  namespace: {{ $.Values.prometheus.rule.namespace }}
  {{- end }}
  labels:
    {{- include "ingress-nginx-monitoring.labels" $ | nindent 4 }}
    {{- if $.Values.prometheus.rule.additionalLabels }}
    {{- toYaml $.Values.prometheus.rule.additionalLabels | nindent 4 }}
    {{- end }}
spec:
  groups:
  - name: ingress-nginx
    rules:
    {{- if $.Values.prometheus.rule.alerts.configFailed.enabled }}
    - alert: NGINXConfigFailed
      expr: count(nginx_ingress_controller_config_last_reload_successful{controller_class=~"{{ $.Values.prometheus.rule.ingressClass}}"} == 0) > 0
      for: {{ $.Values.prometheus.rule.alerts.configFailed.for }}
      labels:
        severity: "{{ $.Values.prometheus.rule.alerts.configFailed.severity }}"
      annotations:
        description: bad ingress config - nginx config test failed
        summary: uninstall the latest ingress changes to allow config reloads to resume
    {{- end }}

    {{- if $.Values.prometheus.rule.alerts.certificateExpiry.enabled }}
    - alert: NGINXCertificateExpiry
      expr: (avg(nginx_ingress_controller_ssl_expire_time_seconds{class=~"{{ $.Values.prometheus.rule.ingressClass}}"}) by (host) - time()) < {{ mul $.Values.prometheus.rule.alerts.certificateExpiry.daysBeforeExpiry 86400 }}
      for: {{ $.Values.prometheus.rule.alerts.certificateExpiry.for }}
      labels:
        severity: "{{ $.Values.prometheus.rule.alerts.certificateExpiry.severity }}"
      annotations:
        description: {{`ssl certificate {{$labels.host}} will expire in less then a week`}}
        summary: renew expiring certificates to avoid downtime
    {{- end }}

    {{- if $.Values.prometheus.rule.alerts.tooMany500s.enabled }}
    - alert: NGINXTooMany500s
      expr: |
        (
          100 *
          sum by (ingress, exported_namespace) (
            rate(nginx_ingress_controller_requests{status=~"5[0-9][0-9]", controller_class=~"{{ $.Values.prometheus.rule.ingressClass}}"}[1h])
          )
          /
          sum by (ingress, exported_namespace) (
            rate(nginx_ingress_controller_requests{controller_class=~"{{ $.Values.prometheus.rule.ingressClass}}"}[1h])
          )
        ) > {{ $.Values.prometheus.rule.alerts.tooMany500s.threshold }}
        and
        sum by (ingress, exported_namespace) (
          increase(nginx_ingress_controller_requests{controller_class=~"{{ $.Values.prometheus.rule.ingressClass}}"}[1h])
        ) > {{ $.Values.prometheus.rule.alerts.tooMany500s.minRequestsPerHour }}
      for: {{ $.Values.prometheus.rule.alerts.tooMany500s.for }}
      labels:
        severity: "{{ $.Values.prometheus.rule.alerts.tooMany500s.severity }}"
      annotations:
        summary: '{{`Too many 5xx errors on ingress {{$labels.ingress}}`}}'
        description: '{{`More than 5% of all requests returned 5xx on ingress {{$labels.ingress}} in namespace {{$labels.exported_namespace}} (minimum 100 req/h)`}}'
    {{- end }}

    {{- if $.Values.prometheus.rule.alerts.tooMany400s.enabled }}
    - alert: NGINXTooMany400s
      expr: |
        (
          100 *
          sum by (ingress, exported_namespace) (
            rate(nginx_ingress_controller_requests{status=~"4[0-9][0-9]", controller_class=~"{{ $.Values.prometheus.rule.ingressClass}}"}[1h])
          )
          /
          sum by (ingress, exported_namespace) (
            rate(nginx_ingress_controller_requests{controller_class=~"{{ $.Values.prometheus.rule.ingressClass}}"}[1h])
          )
        ) > {{ $.Values.prometheus.rule.alerts.tooMany400s.threshold }}
        and
        sum by (ingress, exported_namespace) (
          increase(nginx_ingress_controller_requests{controller_class=~"{{ $.Values.prometheus.rule.ingressClass}}"}[1h])
        ) > {{ $.Values.prometheus.rule.alerts.tooMany400s.minRequestsPerHour }}
      for: {{ $.Values.prometheus.rule.alerts.tooMany400s.for }}
      labels:
        severity: "{{ $.Values.prometheus.rule.alerts.tooMany400s.severity }}"
      annotations:
        summary: '{{`Too many 4xx errors on ingress {{$labels.ingress}}`}}'
        description: '{{`More than 5% of all requests returned 4xx on ingress {{$labels.ingress}} in namespace {{$labels.exported_namespace}} (minimum 100 req/h)`}}'
    {{- end }}


    {{- with $.Values.prometheus.rule.additionalAlerts }}
    {{ . | nindent 4 }}
    {{- end }}
{{- end }}
